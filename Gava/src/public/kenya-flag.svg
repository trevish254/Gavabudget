<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Black stripe -->
  <rect width="900" height="150" fill="#000000"/>
  <!-- Red stripe -->
  <rect y="150" width="900" height="150" fill="#DC143C"/>
  <!-- Green stripe -->
  <rect y="300" width="900" height="150" fill="#006B3C"/>
  <!-- Black stripe -->
  <rect y="450" width="900" height="150" fill="#000000"/>
  <!-- White borders -->
  <rect y="140" width="900" height="20" fill="#ffffff"/>
  <rect y="290" width="900" height="20" fill="#ffffff"/>
  <rect y="440" width="900" height="20" fill="#ffffff"/>
  <!-- Shield and spears (simplified) -->
  <g transform="translate(450, 300)">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="#DC143C" stroke="#ffffff" stroke-width="4"/>
    <rect x="-50" y="-100" width="100" height="20" fill="#ffffff"/>
    <rect x="-50" y="80" width="100" height="20" fill="#ffffff"/>
  </g>
</svg>